name: Claude - GitHub Workflow Failure Reviewer

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read
  id-token: write

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  claude-deployment-review:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: stormreply-runner
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Read deployment guide
        id: deployment-guide
        run: |
          if [ -f .claude/own_scripts/deployment_guide.md ]; then
            DEPLOYMENT_GUIDE=$(cat .claude/own_scripts/deployment_guide.md)
          else
            DEPLOYMENT_GUIDE="No deployment guide available"
          fi
          echo "DEPLOYMENT_GUIDE<<EOF" >> $GITHUB_ENV
          echo "$DEPLOYMENT_GUIDE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ROLE_TO_ASSUME }}:role/github-actions-role
          aws-region: eu-central-1
      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          prompt: |
            REPO: ${{ github.repository }}
            FAILED WORKFLOW: ${{ github.event.workflow_run.name }}
            WORKFLOW RUN ID: ${{ github.event.workflow_run.id }}
            PR NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || 'N/A' }}

            You are a deployment expert analyzing a failed GitHub Actions workflow.
            
            Please:
            1. Inspect the failed workflow logs and identify the root cause
            2. Examine the code changes in the associated PR that may have caused the failure
            3. Provide specific, actionable suggestions to fix the deployment issues
            4. Suggest preventive measures to avoid similar failures
            5. Summarize your findings and suggestions as a comment on the PR
            
            Focus on deployment-specific issues like:
            - Build failures
            - Configuration errors
            - Environment setup problems
            - Dependency issues
            - Infrastructure/deployment script problems
            
            Provide your analysis as inline comments on the relevant code sections when possible.  

            In the following text the Deployment will be further specified:
            
            ${{ env.DEPLOYMENT_GUIDE }}

          claude_args: |
            --model eu.anthropic.claude-sonnet-4-20250514-v1:0
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(gh run download:*)"
